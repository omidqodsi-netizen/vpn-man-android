name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate app configuration
        env:
          VPN_API_BASE_URL: ${{ secrets.VPN_API_BASE_URL }}
          VPN_APP_API_KEY: ${{ secrets.VPN_APP_API_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          [ -n "$VPN_API_BASE_URL" ] || { echo "::error::VPN_API_BASE_URL is missing"; exit 1; }
          [ -n "$VPN_APP_API_KEY" ] || { echo "::error::VPN_APP_API_KEY is missing"; exit 1; }
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 is missing. Configure persistent signing before building."; exit 1; }
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || { echo "::error::ANDROID_KEYSTORE_PASSWORD is missing"; exit 1; }
          [ -n "$ANDROID_KEY_ALIAS" ] || { echo "::error::ANDROID_KEY_ALIAS is missing"; exit 1; }
          [ -n "$ANDROID_KEY_PASSWORD" ] || { echo "::error::ANDROID_KEY_PASSWORD is missing"; exit 1; }

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          [ -x "$SDKMANAGER" ] || { echo "::error::sdkmanager not found"; exit 1; }
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Prepare Xray core and Vazirmatn
        run: bash scripts/prepare-deps.sh

      - name: Restore persistent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          mkdir -p .signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > .signing/vpn-man.jks
          keytool -list -keystore .signing/vpn-man.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null

      - name: Build signed release APK
        env:
          ORG_GRADLE_PROJECT_VPN_API_BASE_URL: ${{ secrets.VPN_API_BASE_URL }}
          ORG_GRADLE_PROJECT_VPN_APP_API_KEY: ${{ secrets.VPN_APP_API_KEY }}
          ORG_GRADLE_PROJECT_VPN_SIGNING_STORE_FILE: ${{ github.workspace }}/.signing/vpn-man.jks
          ORG_GRADLE_PROJECT_VPN_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_VPN_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_VPN_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare artifact
        shell: bash
        run: |
          set -e
          mkdir -p output
          SRC="app/build/outputs/apk/release/app-release.apk"
          DST="output/VPN-Man-v1.1.4-arm64-release.apk"
          cp "$SRC" "$DST"
          sha256sum "$DST" > output/SHA256.txt
          echo "APK size:"
          du -h "$DST"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VPN-Man-Android-v1.1.4-arm64-release
          path: output/
          if-no-files-found: error
          retention-days: 30
