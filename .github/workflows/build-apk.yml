name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate API key
        env:
          VPN_APP_API_KEY: ${{ secrets.VPN_APP_API_KEY }}
        run: |
          if [ -z "$VPN_APP_API_KEY" ]; then
            echo "::error::Secret VPN_APP_API_KEY is missing"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted Ubuntu runners already contain the Android SDK and sdkmanager.
      # We deliberately do NOT use android-actions/setup-android@v3 because it
      # requests the retired SDK package named "tools", which now fails.
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Xray core and Vazirmatn
        run: bash scripts/prepare-deps.sh

      - name: Build debug APK
        env:
          ORG_GRADLE_PROJECT_VPN_APP_API_KEY: ${{ secrets.VPN_APP_API_KEY }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk "output/VPN-Man-v1.0.1-debug.apk"
          sha256sum "output/VPN-Man-v1.0.1-debug.apk" > "output/SHA256.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VPN-Man-Android-v1.0.1
          path: output/
          if-no-files-found: error
          retention-days: 30
