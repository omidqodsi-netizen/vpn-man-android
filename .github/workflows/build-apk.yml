name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository secrets
        env:
          VPN_API_BASE_URL: ${{ secrets.VPN_API_BASE_URL }}
          VPN_APP_API_KEY: ${{ secrets.VPN_APP_API_KEY }}
        run: |
          if [ -z "$VPN_API_BASE_URL" ]; then
            echo "::error::Secret VPN_API_BASE_URL is missing"
            exit 1
          fi
          if [ -z "$VPN_APP_API_KEY" ]; then
            echo "::error::Secret VPN_APP_API_KEY is missing"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Xray core and Vazirmatn
        run: bash scripts/prepare-deps.sh

      - name: Build debug APK
        env:
          ORG_GRADLE_PROJECT_VPN_API_BASE_URL: ${{ secrets.VPN_API_BASE_URL }}
          ORG_GRADLE_PROJECT_VPN_APP_API_KEY: ${{ secrets.VPN_APP_API_KEY }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk "output/VPN-Man-v1.0.0-debug.apk"
          sha256sum "output/VPN-Man-v1.0.0-debug.apk" > "output/SHA256.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VPN-Man-Android-v1.0.0
          path: output/
          if-no-files-found: error
          retention-days: 30
